<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-label="805 Car Guy">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc76a"/>
      <stop offset="55%" stop-color="#f29b58"/>
      <stop offset="100%" stop-color="#e56a4a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e56a4a"/>
      <stop offset="100%" stop-color="#f1a13d"/>
    </linearGradient>
  </defs>

  <!-- sun disc -->
  <circle cx="280" cy="66" r="46" fill="url(#sun)"/>

  <!-- Bishop Peak silhouette behind -->
  <path d="M150 112 L232 50 L280 90 L332 56 L410 112 Z" fill="#d6c49a" opacity=".85"/>

  <!-- teal waves -->
  <path d="M90 116 Q170 104 250 116 T410 116 T470 116 L470 124 L90 124 Z" fill="#1d6b6b"/>
  <path d="M90 128 Q180 120 260 128 T410 128 T470 128 L470 136 L90 136 Z" fill="#2a8a8a" opacity=".85"/>

  <!-- car silhouette -->
  <g fill="#145252">
    <path d="M214 108
             q6 -12 20 -14
             l14 -2
             q6 -8 18 -10
             l34 0
             q14 2 22 10
             l30 2
             q14 2 18 14
             z"/>
    <circle cx="238" cy="112" r="7" fill="#fbf7ef"/>
    <circle cx="238" cy="112" r="4" fill="#145252"/>
    <circle cx="318" cy="112" r="7" fill="#fbf7ef"/>
    <circle cx="318" cy="112" r="4" fill="#145252"/>
  </g>

  <!-- wordmark -->
  <text x="280" y="166" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="34" letter-spacing="4"
        fill="url(#txt)">805 CAR GUY</text>
</svg>
